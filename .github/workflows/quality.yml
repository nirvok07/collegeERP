name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://erp_app:erp_app_local@localhost:5432/college_erp_dev
      MIGRATION_DATABASE_URL: postgres://erp_migrator:erp_migrator_local@localhost:5432/college_erp_dev
      BOOTSTRAP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough
      COOKIE_SECRET: ci-only-cookie-secret-that-is-long-enough
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Create test databases
        run: ./scripts/setup-db.sh
      - name: Bootstrap database roles
        run: npm run db:bootstrap
      - name: Apply development migrations
        run: npm run migrate
      - run: npm run typecheck
      - name: Run server tests
        run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Start Vite preview
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/college-erp-vite.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/college-erp-vite.log
          exit 1
      - name: Capture signed-out visual artifact
        continue-on-error: true
        run: npm run visual-check
      - name: Upload visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-check
          path: clients/web/artifacts/visual-check
          if-no-files-found: ignore
