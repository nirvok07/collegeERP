name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Start Vite preview
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/college-erp-vite.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/college-erp-vite.log
          exit 1
      - name: Capture signed-out visual artifact
        continue-on-error: true
        run: npm run visual-check
      - name: Upload visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-check
          path: clients/web/artifacts/visual-check
          if-no-files-found: ignore
